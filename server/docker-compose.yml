services:
  ntfy:
    image: binwiederhier/ntfy:v2.29.0
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: https://${NTFY_DOMAIN}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 8760h
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_BEHIND_PROXY: "true"
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
    volumes:
      - ./data:/var/lib/ntfy
    networks:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      NTFY_DOMAIN: ${NTFY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ntfy
    networks:
      - backend

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:
